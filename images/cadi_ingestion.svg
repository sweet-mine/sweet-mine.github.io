<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="CADI DFM 현업 피드백 기반 핵심 개선 포인트">
  <defs>
    <style>
      .txt { font-family: 'Pretendard Variable', 'Pretendard', 'Malgun Gothic', sans-serif; }
      .title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 10.5px; font-weight: 500; fill: #64748b; }
      .card-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .card-body { font-size: 10.5px; font-weight: 500; fill: #475569; }
      .pill-accent { font-size: 10.5px; font-weight: 700; fill: #4f46e5; }
      .pill-ok { font-size: 10.5px; font-weight: 700; fill: #047857; }
      .pill-warn { font-size: 10.5px; font-weight: 700; fill: #c2410c; }
    </style>
  </defs>

  <rect x="1" y="1" width="518" height="338" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="22" y="29" class="txt title">현업 피드백 기반 핵심 개선 포인트</text>
  <text x="22" y="47" class="txt sub">비정형 문서 대응 · 에이전트 전환 · 운영 단순화</text>

  <!-- Card 1 -->
  <rect x="20" y="64" width="480" height="78" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="20" y="64" width="5" height="78" rx="2" fill="#4f46e5"/>
  <text x="36" y="85" class="txt card-title">1. 문서 등록 이원화 (Rule + AI 하이브리드)</text>
  <rect x="382" y="71" width="104" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="434" y="85" text-anchor="middle" class="txt pill-accent">원문 검수 등록</text>
  <text x="36" y="106" class="txt card-body">• 규격 Excel: 승인 양식 규칙 메모리 캐싱 파싱 (DB 중복 조회 제거)</text>
  <text x="36" y="125" class="txt card-body">• 비정형(DOCX·PPTX·지정 XLSX): Gemini JSON 추출 후 담당자 원문 대조</text>

  <!-- Card 2 -->
  <rect x="20" y="154" width="480" height="78" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="20" y="154" width="5" height="78" rx="2" fill="#3b82f6"/>
  <text x="36" y="175" class="txt card-title">2. 답변 품질 · UX 개선 (에이전트 + 스트리밍)</text>
  <rect x="382" y="161" width="104" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="434" y="175" text-anchor="middle" class="txt pill-ok">현업 피드백 반영</text>
  <text x="36" y="196" class="txt card-body">• 고정 포맷 응답 실패 해소 → LangChain 도구 호출 기반 동적 조회 전환</text>
  <text x="36" y="215" class="txt card-body">• 장문 응답 핵심 축약 프롬프팅, 실시간 스트리밍·관리자 화면 분리</text>

  <!-- Card 3 -->
  <rect x="20" y="244" width="480" height="78" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="20" y="244" width="5" height="78" rx="2" fill="#0f172a"/>
  <text x="36" y="265" class="txt card-title">3. 운영 스키마 단순화 &amp; 사내 데모 배포</text>
  <rect x="382" y="251" width="104" height="20" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="434" y="265" text-anchor="middle" class="txt pill-warn">18 → 6 테이블</text>
  <text x="36" y="286" class="txt card-body">• 멘토 피드백 기반 불필요 이력 테이블 정리 및 명명 규칙 통일</text>
  <text x="36" y="305" class="txt card-body">• 로컬 바인딩 한계 해결 후 사내 내부 데모 배포 · 실사용 담당자 전달</text>
</svg>
