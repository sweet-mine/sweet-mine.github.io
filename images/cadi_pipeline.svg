<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="CADI DFM 하이브리드 문서 등록 및 검색 검증 파이프라인">
  <defs>
    <style>
      .txt { font-family: 'Pretendard Variable', 'Pretendard', 'Malgun Gothic', sans-serif; }
      .title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 11px; font-weight: 500; fill: #475569; }
      .badge-txt { font-size: 10.5px; font-weight: 700; fill: #4f46e5; }
      .pill-txt { font-size: 10px; font-weight: 600; fill: #1e293b; }
      .sec-label { font-size: 10.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.4px; }
      .warn-title { font-size: 13px; font-weight: 700; fill: #9a3412; }
      .warn-sub { font-size: 11px; font-weight: 500; fill: #c2410c; }
      .ok-title { font-size: 13px; font-weight: 700; fill: #065f46; }
      .ok-sub { font-size: 11px; font-weight: 500; fill: #047857; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="28" class="txt title" font-size="14">DFM 질의응답 AI 챗봇 아키텍처 (하이브리드 등록 · RRF 검색 · 답변 개선)</text>
  <rect x="556" y="13" width="140" height="22" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="626" y="28" text-anchor="middle" class="txt badge-txt">FastAPI · PostgreSQL</text>

  <!-- Stage 1: Hybrid Ingestion -->
  <rect x="20" y="48" width="212" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="69" class="txt sec-label">1. HYBRID INGESTION</text>

  <rect x="32" y="82" width="188" height="68" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="126" y="103" text-anchor="middle" class="txt title">Excel 승인 양식 규칙 파싱</text>
  <text x="126" y="121" text-anchor="middle" class="txt sub">XLS·XLSX·XLSB·XLSM</text>
  <text x="126" y="137" text-anchor="middle" class="txt sub">정규화 헤더 · 병합 셀 처리</text>

  <rect x="32" y="164" width="188" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="126" y="185" text-anchor="middle" class="txt title">비정형 Gemini JSON 추출</text>
  <text x="126" y="203" text-anchor="middle" class="txt sub">DOCX · PPTX · 지정 XLSX</text>
  <text x="126" y="220" text-anchor="middle" class="txt sub">외부 자동 전송 없이 추출 입력</text>

  <rect x="32" y="250" width="188" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="126" y="272" text-anchor="middle" class="txt warn-title">원문 대조 · 담당자 검수</text>
  <text x="126" y="289" text-anchor="middle" class="txt warn-sub">기업 · 보드 · PCS 메타데이터 등록</text>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <path d="M 232 182 L 260 182" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 2: Storage & Async Indexing -->
  <rect x="264" y="48" width="194" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="278" y="69" class="txt sec-label">2. STORAGE &amp; INDEXING</text>

  <rect x="276" y="84" width="170" height="76" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="361" y="106" text-anchor="middle" class="txt title">PostgreSQL · pgvector</text>
  <text x="361" y="124" text-anchor="middle" class="txt sub">트랜잭션 사례 저장 · 6개 테이블</text>
  <text x="361" y="142" text-anchor="middle" class="txt sub">원문 버전 · 세대 관리</text>

  <rect x="276" y="176" width="170" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="361" y="198" text-anchor="middle" class="txt title">비동기 색인 Worker</text>
  <text x="361" y="216" text-anchor="middle" class="txt sub">질의/문서 세대 재확인(덮어쓰기 방지)</text>

  <rect x="288" y="229" width="146" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="361" y="246" text-anchor="middle" class="txt pill-txt">question-v1 (질의 검토용)</text>

  <rect x="288" y="263" width="146" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="361" y="280" text-anchor="middle" class="txt pill-txt">knowledge-v2 (정보 챗봇용)</text>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <path d="M 458 182 L 486 182" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 3: Retrieval & Verified Response -->
  <rect x="490" y="48" width="210" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="504" y="69" class="txt sec-label">3. RETRIEVAL &amp; VERIFICATION</text>

  <rect x="502" y="84" width="186" height="72" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="595" y="105" text-anchor="middle" class="txt title">RRF 하이브리드 검색</text>
  <text x="595" y="123" text-anchor="middle" class="txt sub">키워드(2-gram) + pgvector 코사인</text>
  <text x="595" y="140" text-anchor="middle" class="txt sub">기업 · 보드 · PCS 조건 필터링</text>

  <path d="M 595 156 L 595 172" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-slate)"/>

  <rect x="502" y="176" width="186" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="595" y="198" text-anchor="middle" class="txt title">LangChain Tool Calling</text>
  <text x="595" y="216" text-anchor="middle" class="txt sub">필요 시 사례 전문 · 메타데이터 조회</text>

  <path d="M 595 234 L 595 250" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-slate)"/>

  <rect x="502" y="254" width="186" height="48" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="595" y="274" text-anchor="middle" class="txt ok-title">요약 · 스트리밍 응답</text>
  <text x="595" y="291" text-anchor="middle" class="txt ok-sub">현업 피드백 기반 답변 품질·UX 개선</text>
</svg>
