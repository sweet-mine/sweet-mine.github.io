<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-label="KinderBot 교사 웹 및 ROS 2 Task Manager 아키텍처">
  <defs>
    <style>
      .txt { font-family: 'Pretendard Variable', 'Pretendard', 'Malgun Gothic', sans-serif; }
      .title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 11px; font-weight: 500; fill: #475569; }
      .badge { font-size: 10.5px; font-weight: 700; fill: #4f46e5; }
      .sec { font-size: 10.5px; font-weight: 700; fill: #64748b; }
      .ok-title { font-size: 13px; font-weight: 700; fill: #065f46; }
      .ok-sub { font-size: 11px; font-weight: 500; fill: #047857; }
    </style>
    <marker id="kb-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="#4f46e5"/>
    </marker>
    <marker id="kb-arrow-bi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="718" height="348" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="24" y="28" class="txt title" font-size="14">KinderBot 시스템 통합 아키텍처 (웹 · ROS 2 오케스트레이션 · 시뮬레이션)</text>
  <rect x="526" y="13" width="170" height="22" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="611" y="28" text-anchor="middle" class="txt badge">팀장 · 통합 오케스트레이션</text>

  <!-- Top Row: Web UI & Backend -->
  <rect x="24" y="48" width="210" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="129" y="72" text-anchor="middle" class="txt title">교사 웹 작업 요청</text>
  <text x="129" y="90" text-anchor="middle" class="txt sub">활동 · 교보재 · 테이블 배치 선택</text>
  <text x="129" y="106" text-anchor="middle" class="txt sub">수거/배치 완료 상태 실시간 조회</text>

  <path d="M 234 84 L 266 84" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#kb-arrow)"/>

  <rect x="270" y="48" width="206" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="373" y="72" text-anchor="middle" class="txt title">FastAPI · PostgreSQL</text>
  <text x="373" y="90" text-anchor="middle" class="txt sub">YAML(활동·교보재·위치) + 실행 DB</text>
  <text x="373" y="106" text-anchor="middle" class="txt sub">작업 요청 API &amp; 상태 영속화</text>

  <path d="M 476 84 L 508 84" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#kb-arrow)"/>

  <rect x="512" y="48" width="184" height="72" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="604" y="72" text-anchor="middle" class="txt ok-title">실물 팔 SmolVLA 시연</text>
  <text x="604" y="90" text-anchor="middle" class="txt ok-sub">팀 확장 · SO-101 / LeRobot</text>
  <text x="604" y="106" text-anchor="middle" class="txt ok-sub">전면·손목 카메라 Sim-to-Real</text>

  <!-- Central Node: ROS 2 Task Manager -->
  <path d="M 373 120 L 373 148" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#kb-arrow)"/>

  <rect x="120" y="152" width="480" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="360" y="177" text-anchor="middle" class="txt title" font-size="14">ROS 2 Task Manager (직접 구현)</text>
  <text x="360" y="197" text-anchor="middle" class="txt sub">동일 선반 교보재 연속 수거 순서 조율 · 주행/도킹/조작 호출 · 수거 vs 배치 이벤트 분리 보고</text>

  <!-- Connectors to 3 modules -->
  <path d="M 210 214 L 130 244" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#kb-arrow)"/>
  <path d="M 360 214 L 360 244" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#kb-arrow)"/>
  <path d="M 510 214 L 590 244" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#kb-arrow)"/>

  <!-- Bottom Module 1: OR-Tools -->
  <rect x="24" y="248" width="212" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="130" y="269" text-anchor="middle" class="txt sec">PATH PLANNER</text>
  <text x="130" y="288" text-anchor="middle" class="txt title">OR-Tools 방문 순서 최적화</text>
  <text x="130" y="306" text-anchor="middle" class="txt sub">위치 간 주행 비용 행렬 기반</text>
  <text x="130" y="321" text-anchor="middle" class="txt sub">반복 이동 · 재도킹 횟수 최소화</text>

  <!-- Bottom Module 2: Nav2 -->
  <rect x="254" y="248" width="212" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="360" y="269" text-anchor="middle" class="txt sec">NAVIGATION</text>
  <text x="360" y="288" text-anchor="middle" class="txt title">Nav2 자율주행 · 정밀 도킹</text>
  <text x="360" y="306" text-anchor="middle" class="txt sub">구간별 주행 비용 산출 · 전달</text>
  <text x="360" y="321" text-anchor="middle" class="txt sub">AMCL 위치 추정 · 테이블 도킹</text>

  <!-- Bottom Module 3: Isaac Sim -->
  <rect x="484" y="248" width="212" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="590" y="269" text-anchor="middle" class="txt sec">SIMULATION &amp; MANIPULATION</text>
  <text x="590" y="288" text-anchor="middle" class="txt title">Isaac Sim 조작 (IK / ACT)</text>
  <text x="590" y="306" text-anchor="middle" class="txt sub">선반 수거 · 테이블 배치 실행</text>
  <text x="590" y="321" text-anchor="middle" class="txt sub">웹 연동 IK 반복 시험 4/4 완료</text>

  <!-- Bidirectional hint between OR-Tools & Nav2 -->
  <path d="M 236 290 L 254 290" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3,2" fill="none"/>
</svg>
